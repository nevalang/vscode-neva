---
"$schema": https://raw.githubusercontent.com/martinring/tmlanguage/master/tmlanguage.json
name: neva
scopeName: source.neva
fileTypes:
  - ".neva"

# ================================================================
# REPOSITORY (reusable patterns)
# ================================================================

repository:
  comments:
    patterns:
      - name: comment.line.double-slash
        match: "//.*$" # Matches a single-line comment

  pub:
    match: "\\b(pub)\\b" # Matches the keyword 'pub'
    name: storage.modifier

  # ----------------------------------------------------------------
  # TYPES
  # ----------------------------------------------------------------

  builtin_types:
    patterns:
      - match: "\\bany\\b" # Matches the word 'any'
        name: support.type
      - match: "\\bmaybe\\b" # Matches the word 'maybe'
        name: support.type
      - match: "\\bbool\\b" # Matches the word 'bool'
        name: support.type
      - match: "\\b(int|float)\\b" # Matches the words 'int' or 'float'
        name: support.type
      - match: "\\bstring\\b" # Matches the word 'string'
        name: support.type
      - match: "\\bdict\\b" # Matches the word 'dict'
        name: support.type
      - match: "\\blist\\b" # Matches the word 'list'
        name: support.type
      - match: "\\berror\\b" # Matches the word 'error'
        name: support.type
      - match: "\\bstream\\b" # Matches the word 'stream'
        name: support.type
      - include: "#struct_type"
      - include: "#union_type"

  struct_type:
    patterns:
      - begin: "\\b(struct)\\s*\\{"
        beginCaptures:
          "1":
            name: keyword.control
        end: "\\}"
        patterns:
          - include: "#builtin_types" # recursion
          - include: "#comments"

  union_type:
    patterns:
      - begin: "\\b(union)\\s*\\{"
        beginCaptures:
          "1":
            name: keyword.control
        end: "\\}"
        patterns:
          - include: "#builtin_types" # For nested types
          - include: "#comments"

  # ----------------------------------------------------------------
  # CONSTANT LITERALS
  # ----------------------------------------------------------------

  const_literals:
    patterns:
      - include: "#nil_literal"
      - include: "#bool_literals"
      - include: "#num_literals"
      - include: "#string_literals"
      - include: "#union_literal"
      - include: "#list_literal"
      - include: "#struct_literal"

  union_literal:
    patterns:
      - match: "\\b((?:\\w+\\.)?\\w+)::(\\w+)\\b"
        captures:
          "1":
            name: entity.name.type
          "2":
            name: variable.other.enummember

  num_literals:
    patterns:
      - match: "\\b0[xX][0-9a-fA-F]+\\b"
        name: constant.numeric.hexadecimal
      - match: "\\b[0-9]+\\.?[0-9]*([eE][-+]?[0-9]+)?\\b"
        name: constant.numeric.float
      - match: "\\b[0-9]+\\b"
        name: constant.numeric.integer

  string_literals:
    patterns:
      - name: string.quoted.double
        begin: '"'
        end: '"'
        patterns:
          - match: \\""
            name: constant.character.escape.double-quote
      - name: string.quoted.single
        begin: "'"
        end: "'"
        patterns:
          - match: \\'"
            name: constant.character.escape.single-quote

  bool_literals:
    match: "\\b(true|false)"
    name: constant.language.boolean

  nil_literal:
    match: "\\b(nil)"
    name: constant.language.nil

  struct_literal: # and dict literal
    patterns:
      - begin: "\\{"
        end: "\\}"
        patterns:
          - include: "#const_literals" # recursion

  list_literal:
    patterns:
      - begin: "\\["
        end: "\\]"
        patterns:
          - include: "#const_literals" # recursion

  # ----------------------------------------------------------------
  # OTHER
  # ----------------------------------------------------------------

  compiler_directives:
    patterns:
      - name: meta.directive
        begin: "\\#"
        beginCaptures:
          "1":
            name: meta.directive
        end: "(?:\\n|$)" # end of line or end of the input

  # ----------------------------------------------------------------
  # COMPONENTS
  # ----------------------------------------------------------------

  nodes:
    patterns:
      - begin: "\\{"
        end: "---"
        patterns:
          - include: "#nodes_body"
          - include: "#comments"

  nodes_body:
    patterns:
      - include: "#builtin_types"
      - match: "^(\\s*)\\b(\\w+)\\b\\s+((\\w+\\.)*\\w+)\\b"
        captures:
          "2":
            name: variable.other.node
          "3":
            name: entity.name.function
      - begin: "\\{"
        end: "\\}"
        patterns:
          - include: "#nodes_body" # DI
          - include: "#comments"

  net:
    patterns:
      - include: "#bool_literals"
      - include: "#num_literals"
      - include: "#string_literals"
      - include: "#union_literal"
      - match: "\\[\\*\\]"
        name: keyword.operator
      - match: "\\$\\w+"
        name: variable.other.constant
      - match: "\\:(\\w+)\\b" # io port addrs
        captures:
          "1":
            name: variable.parameter
      - match: "(\\w+)\\b\\:(\\w+)\\b" # norm port addrs
        captures:
          "1":
            name: variable.other.node
          "2":
            name: variable.parameter
      - match: "(\\w+)\\b" # io port addrs
        captures:
          "1":
            name: variable.parameter
      - include: "#comments"
      - begin: "->"
        name: keyword.control
        end: "(?=\\n|$)" # Matches either a newline or end of input, using positive lookahead
        patterns:
          - begin: "\\{"
            end: "\\}"
            patterns:
              - include: "#net" # Allow recursion for nested patterns
          - include: "#net" # Include other net patterns after ->

# ================================================================
# PATTERNS (actual rules)
# ================================================================

patterns:
  - include: "#comments"
  - include: "#pub"
  - include: "#compiler_directives"

  # ----------------------------------------------------------------
  # IMPORTS
  # ----------------------------------------------------------------

  - begin: "\\b(import)\\s*\\{"
    beginCaptures:
      "1":
        name: keyword.control.import
    end: "\\}"
    patterns:
      - include: "#comments"

  # ----------------------------------------------------------------
  # TYPES
  # ----------------------------------------------------------------

  - begin: "\\b(type)\\s+\\b(\\w+)\\b"
    beginCaptures:
      "1":
        name: keyword.control
      "2":
        name: entity.name.type
    end: "(?=\\b(import|pub|type|const|interface|def)\\b)"
    patterns:
      - include: "#builtin_types"
      - include: "#comments"

  # ----------------------------------------------------------------
  # INTERFACES
  # ----------------------------------------------------------------

  - begin: "\\b(interface)\\s+\\b(\\w+)\\b"
    beginCaptures:
      "1":
        name: keyword.control
      "2":
        name: entity.name.type
    end: "(?=\\b(import|pub|type|const|interface|def)\\b)"
    patterns:
      - include: "#builtin_types"
      - include: "#comments"
      - match: "\\b(\\w+)\\b" # Add this pattern to match parameters
        captures:
          "1":
            name: variable.parameter

  # ----------------------------------------------------------------
  # CONSTANTS
  # ----------------------------------------------------------------

  - begin: "\\b(const)\\s+\\b(\\w+)\\b"
    beginCaptures:
      "1":
        name: keyword.control
      "2":
        name: variable.other.constant
    end: "(?=\\b(import|pub|type|const|interface|def)\\b)"
    patterns:
      - include: "#builtin_types"
      - include: "#const_literals"
      - include: "#comments"

  # ----------------------------------------------------------------
  # COMPONENTS
  # ----------------------------------------------------------------

  - begin: "\\b(def)\\s+\\b(\\w+)"
    beginCaptures:
      "1":
        name: keyword.control
      "2":
        name: entity.name.function
    end: "(?=\\b(import|pub|type|const|interface|def)\\b)"
    patterns:
      - include: "#builtin_types"
      - include: "#nodes"
      - include: "#net"
      - include: "#comments"
