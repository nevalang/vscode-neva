name: Release VS Code Marketplace

on:
  release:
    types: [published]
  workflow_dispatch:

concurrency:
  group: marketplace-release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish-marketplace:
    runs-on: ubuntu-latest
    env:
      VSCE_PAT: ${{ secrets.VSCE_PAT }}
    steps:
      - name: Checkout vscode-neva
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Checkout neva main
        uses: actions/checkout@v4
        with:
          repository: nevalang/neva
          ref: main
          path: neva-main

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: neva-main/go.mod

      - name: Validate required secret
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${VSCE_PAT:-}" ]]; then
            echo "Repository secret VSCE_PAT is missing" >&2
            exit 1
          fi

      - name: Build LSP binaries from neva main
        run: ./scripts/release/build-lsp-from-neva-main.sh ./neva-main ./bin

      - name: Verify release tag matches package version
        if: github.event_name == 'release'
        shell: bash
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME#v}"
          PKG_VERSION=$(node -p "require('./package.json').version")
          if [[ "$TAG" != "$PKG_VERSION" ]]; then
            echo "Tag version ($TAG) does not match package.json version ($PKG_VERSION)" >&2
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Build extension
        run: npm run build

      - name: Package extension
        run: npx -y @vscode/vsce@2.24.0 package -o vscode-nevalang.vsix

      - name: Publish to VS Code Marketplace
        run: npx -y @vscode/vsce@2.24.0 publish --packagePath vscode-nevalang.vsix -p "$VSCE_PAT"

      - name: Upload VSIX artifact
        uses: actions/upload-artifact@v4
        with:
          name: vscode-nevalang
          path: vscode-nevalang.vsix
